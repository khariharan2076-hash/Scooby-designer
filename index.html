<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scooby's Designer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff8fc;color:#241b27}.top{background:linear-gradient(135deg,#ff4fa3,#7c4dff);color:white;padding:26px 18px;text-align:center}.top h1{margin:0;font-size:30px}.top p{margin:7px 0 0}.wrap{max-width:1000px;margin:auto;padding:18px}.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#7c4dff;color:#fff}.wa{background:#19b95b;color:#fff;width:100%}.adminBtn{background:#222;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #00000012;border:1px solid #eee}.pic{width:100%;height:210px;object-fit:cover;background:#f1edf4}.body{padding:13px}.name{font-size:18px;font-weight:800}.price{font-size:18px;font-weight:800;margin:7px 0}.avail{font-size:13px;margin-bottom:10px}.green{color:#149447}.red{color:#d83232}.empty{text-align:center;padding:40px;color:#777}.panel{display:none;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 20px #0001;margin-bottom:20px}.panel.show{display:block}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.admin-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.thumb{width:70px;height:60px;object-fit:cover;border-radius:9px;background:#eee}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:8px 10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:white;padding:20px;border-radius:18px;width:min(400px,100%)}footer{text-align:center;padding:25px;color:#777;font-size:13px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:160px}.name{font-size:15px}.price{font-size:16px}}
</style></head><body>
<header class="top"><h1>🧶 Scooby's Designer</h1><p>Handmade Scooby creations • Order on WhatsApp</p></header>
<main class="wrap"><div class="bar"><h2>Our Designs</h2><button class="btn adminBtn" onclick="openLogin()">🔐 Admin</button></div>
<section id="admin" class="panel"><div class="bar"><h2>Admin Panel</h2><button class="btn" onclick="logout()">Logout</button></div><div class="formgrid"><input id="pname" class="input" placeholder="Product name"><input id="pprice" class="input" type="number" min="0" placeholder="Price (₹)"><input id="pphoto" class="input" type="file" accept="image/*"><button class="btn primary" onclick="addProduct()">➕ Add Product</button></div><p style="font-size:13px;color:#777">Add a photo from your phone. Changes are saved in this browser.</p><div id="adminList"></div></section>
<section id="grid" class="grid"></section></main><footer>© Scooby's Designer</footer>
<div id="login" class="modal"><div class="box"><h2>🔐 Admin Login</h2><input id="pass" class="input" type="password" placeholder="Admin password"><div style="height:10px"></div><div class="actions"><button class="btn primary" onclick="login()">Login</button><button class="btn" onclick="closeLogin()">Cancel</button></div><p id="err" class="red"></p></div></div>
<script>
const KEY='scoobys_products_v1', ADMIN='Hari1302', WA='918778173065';
let products=JSON.parse(localStorage.getItem(KEY)||'null')||[
{name:'Square',price:30,img:'',available:true},{name:'DNA',price:40,img:'',available:true},{name:'Butterfly',price:50,img:'',available:true},{name:'Snake',price:40,img:'',available:true}];
function save(){localStorage.setItem(KEY,JSON.stringify(products));render();renderAdmin()}
function render(){let g=document.getElementById('grid');let a=products.filter(p=>p.available);if(!a.length){g.innerHTML='<div class="empty">No products available right now.</div>';return}g.innerHTML=a.map((p,i)=>`<article class="card"><img class="pic" src="${p.img||placeholder(p.name)}" alt="${esc(p.name)}"><div class="body"><div class="name">${esc(p.name)}</div><div class="price">₹${Number(p.price||0)}</div><div class="avail green">🟢 Available</div><button class="btn wa" onclick="order('${escAttr(p.name)}',${Number(p.price||0)})">Order Now on WhatsApp</button></div></article>`).join('')}
function renderAdmin(){let l=document.getElementById('adminList');l.innerHTML=products.map((p,i)=>`<div class="admin-item"><img class="thumb" src="${p.img||placeholder(p.name)}"><div><b>${esc(p.name)}</b><br>₹${Number(p.price||0)} • ${p.available?'🟢 Available':'🔴 Not Available'}</div><div class="actions"><button class="btn small" onclick="editProduct(${i})">✏️ Edit</button><button class="btn small" onclick="toggle(${i})">${p.available?'🔴 Hide':'🟢 Show'}</button><button class="btn small" onclick="delProduct(${i})">🗑️</button></div></div>`).join('')}
function placeholder(n){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500"><rect width="100%" height="100%" fill="#f3e9f2"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="44" fill="#777">${n}</text></svg>`)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function escAttr(s){return String(s).replace(/'/g,"\\'")}
function order(n,p){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(`Hi! I want to order ${n} (₹${p}) from Scooby's Designer.`)}`,'_blank')}
function openLogin(){document.getElementById('login').classList.add('show');document.getElementById('pass').focus()}function closeLogin(){document.getElementById('login').classList.remove('show');document.getElementById('err').textContent=''}
function login(){if(document.getElementById('pass').value===ADMIN){closeLogin();document.getElementById('admin').classList.add('show');renderAdmin()}else document.getElementById('err').textContent='Wrong password'}function logout(){document.getElementById('admin').classList.remove('show')}
function addProduct(){let n=document.getElementById('pname').value.trim(),p=document.getElementById('pprice').value, f=document.getElementById('pphoto').files[0];if(!n||p===''){alert('Name and price enter pannunga');return}let done=img=>{products.push({name:n,price:Number(p),img:img||'',available:true});document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pphoto').value='';save()};if(f){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done('')}
function editProduct(i){let n=prompt('Product name:',products[i].name);if(n===null)return;let p=prompt('Price ₹:',products[i].price);if(p===null)return;products[i].name=n.trim()||products[i].name;products[i].price=Number(p)||0;save()}
function toggle(i){products[i].available=!products[i].available;save()}function delProduct(i){if(confirm('Delete this product?')){products.splice(i,1);save()}}
render();
</script></body></html>
