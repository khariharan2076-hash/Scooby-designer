<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scooby's Designer</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:#fff8fc;
color:#241b27
}
.top{
background:linear-gradient(135deg,#ff4fa3,#7c4dff);
color:white;
padding:26px 18px;
text-align:center
}
.top h1{margin:0;font-size:30px}
.top p{margin:7px 0 0}
.wrap{max-width:1000px;margin:auto;padding:18px}
.bar{
display:flex;
gap:10px;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
margin-bottom:16px
}
.btn{
border:0;
border-radius:12px;
padding:11px 15px;
font-weight:700;
cursor:pointer
}
.primary{background:#7c4dff;color:white}
.adminBtn{background:#222;color:white}
.wa{background:#19b95b;color:white;width:100%}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:16px
}
.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 4px 18px #00000012;
border:1px solid #eee
}
.pic{
width:100%;
height:210px;
object-fit:cover;
background:#f1edf4
}
.body{padding:13px}
.name{font-size:18px;font-weight:800}
.price{font-size:18px;font-weight:800;margin:7px 0}
.green{color:#149447}
.red{color:#d83232}
.avail{font-size:13px;margin-bottom:10px}
.empty{text-align:center;padding:40px;color:#777}
.panel{
display:none;
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 4px 20px #0001;
margin-bottom:20px
}
.panel.show{display:block}
.formgrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px
}
.input{
width:100%;
padding:11px;
border:1px solid #ddd;
border-radius:10px
}
.admin-item{
display:grid;
grid-template-columns:70px 1fr auto;
gap:10px;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee
}
.thumb{
width:70px;
height:60px;
object-fit:cover;
border-radius:9px;
background:#eee
}
.actions{
display:flex;
gap:7px;
flex-wrap:wrap
}
.small{padding:8px 10px}
.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:20
}
.modal.show{display:flex}
.box{
background:white;
padding:20px;
border-radius:18px;
width:min(400px,100%)
}
footer{
text-align:center;
padding:25px;
color:#777;
font-size:13px
}
@media(max-width:500px){
.grid{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px
}
.pic{height:160px}
.name{font-size:15px}
.price{font-size:16px}
}
</style>
</head>

<body>

<header class="top">
<h1>🧶 Scooby's Designer</h1>
<p>Handmade Scooby creations • Order on WhatsApp</p>
</header>

<main class="wrap">

<div class="bar">
<h2>Our Designs</h2>
<button class="btn adminBtn" onclick="openLogin()">🔐 Admin</button>
</div>

<section id="admin" class="panel">

<div class="bar">
<h2>Admin Panel</h2>
<button class="btn" onclick="logout()">Logout</button>
</div>

<div class="formgrid">

<input id="pname"
class="input"
placeholder="Product name">

<input id="pprice"
class="input"
type="number"
min="0"
placeholder="Price (₹)">

<input id="pphoto"
class="input"
type="file"
accept="image/*">

<button class="btn primary" onclick="addProduct()">
➕ Add Product
</button>

</div>

<p style="font-size:13px;color:#777">
Add product, price and photo. Changes are saved online.
</p>

<div id="adminList"></div>

</section>

<section id="grid" class="grid"></section>

</main>

<footer>© Scooby's Designer</footer>


<div id="login" class="modal">

<div class="box">

<h2>🔐 Admin Login</h2>

<input id="email"
class="input"
type="email"
placeholder="Admin email">

<div style="height:10px"></div>

<input id="pass"
class="input"
type="password"
placeholder="Password">

<div style="height:10px"></div>

<div class="actions">

<button class="btn primary" onclick="login()">Login</button>

<button class="btn" onclick="closeLogin()">Cancel</button>

</div>

<p id="err" class="red"></p>

</div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
